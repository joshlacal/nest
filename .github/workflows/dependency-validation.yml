name: Linux container dependency validation

on:
  pull_request:
  push:
    branches: [codex/dependency-refresh-20261025]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        service: [catbird, circle-appview]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: nest
      - name: Record native Linux x86_64 build environment
        run: |
          test "$(uname -m)" = x86_64
          uname -a
          docker version
      - name: Build gateway image
        if: matrix.service == 'catbird'
        shell: bash
        run: |
          docker build --progress plain --platform linux/amd64 \
            --tag nest-dependency-validation:catbird \
            --file nest/catbird/Dockerfile nest/catbird 2>&1 | tee docker-build.log
      - name: Build Circle image
        if: matrix.service == 'circle-appview'
        shell: bash
        run: |
          docker build --progress plain --platform linux/amd64 \
            --tag nest-dependency-validation:circle-appview \
            --file nest/circle-appview/Dockerfile . 2>&1 | tee docker-build.log
      - name: Record built image identity
        run: docker image inspect nest-dependency-validation:${{ matrix.service }} > image.json
      - name: Retain build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-amd64-${{ matrix.service }}
          path: |
            docker-build.log
            image.json
          if-no-files-found: warn
          retention-days: 14
