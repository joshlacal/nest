[package]
name = "catbird"
version = "0.1.0"
edition = "2021"
description = "Catbird Nest - A BFF Gateway for ATProto/Bluesky"
license = "MIT"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["cookie", "typed-header"] }
tower = { version = "0.4", features = ["util", "timeout"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id"] }
tower_governor = "0.4"

# Async Runtime
tokio = { version = "1", features = ["full"] }

# HTTP Client
reqwest = { version = "0.13", features = ["json", "cookies", "multipart", "stream", "brotli", "gzip", "deflate"] }
flate2 = "1.0"
brotli = "8.0"
# Jacquard (AT Protocol)
jacquard-oauth = { git = "https://tangled.org/nonbinary.computer/jacquard", rev = "3287244a99262a361bd32873a871982da0a76c40", features = ["default"] }
jacquard-common = { git = "https://tangled.org/nonbinary.computer/jacquard", rev = "3287244a99262a361bd32873a871982da0a76c40", features = ["reqwest-client"] }
jacquard-identity = { git = "https://tangled.org/nonbinary.computer/jacquard", rev = "3287244a99262a361bd32873a871982da0a76c40", features = ["dns", "cache"] }
jose-jwk = { version = "0.1", features = ["p256"] }
catbird-atproto = { path = "../../catbird-atproto", features = ["namespace-bluecatbird", "namespace-site-standard"] }

# Encryption
aes-gcm = "0.10"
dashmap = "6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto for DPoP and Client Assertions
p256 = { version = "0.13", features = ["jwk", "ecdsa", "pkcs8"] }
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
subtle = "2.6"
multibase = "0.9"

# Session Storage
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "time", "chrono", "uuid", "json"] }

# Configuration
dotenvy = "0.15"
config = "0.14"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# CLI (for session_migrate binary)
clap = { version = "4", features = ["derive", "env"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
futures-util = "0.3"
regex = "1"
async-trait = "0.1"

# Metrics
prometheus = { version = "0.13", default-features = false }
lazy_static = "1.4"
http = "1.0"
bytes = "1.0"
urlencoding = "2.1"
time = "0.3"
smol_str = { version = "0.3", features = ["serde"] }
ipnet = "2.10"
a2 = "0.10"

[dev-dependencies]
axum-test = "15"
tokio-test = "0.4"
wiremock = "0.6"
testcontainers = "0.18"
testcontainers-modules = { version = "0.6", features = ["redis"] }

[lints.rust]
dead_code = "allow"
unused_variables = "allow"
unused_imports = "allow"

[lints.clippy]
too_many_arguments = "allow"
doc_markdown = "allow"
needless_borrow = "allow"
useless_conversion = "allow"
needless_question_mark = "allow"
useless_vec = "allow"
derivable_impls = "allow"
collapsible_if = "allow"
match_like_matches_macro = "allow"
unnecessary_sort_by = "allow"
unnecessary_to_owned = "allow"
io_other_error = "allow"
needless_borrows_for_generic_args = "allow"
useless_borrows_in_formatting = "allow"
identity_op = "allow"
unnecessary_cast = "allow"
question_mark = "allow"
doc_lazy_continuation = "allow"
collapsible_match = "allow"
enum_variant_names = "allow"
large_enum_variant = "allow"
field_reassign_with_default = "allow"
manual_range_contains = "allow"
default_constructed_unit_structs = "allow"
double_ended_iterator_last = "allow"
ptr_arg = "allow"
assertions_on_constants = "allow"
bool_assert_comparison = "allow"

