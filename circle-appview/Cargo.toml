[package]
name = "circle-appview"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json"] }
jacquard-repo = { git = "https://tangled.org/nonbinary.computer/jacquard", rev = "3287244a99262a361bd32873a871982da0a76c40" }
jacquard-common = { git = "https://tangled.org/nonbinary.computer/jacquard", rev = "3287244a99262a361bd32873a871982da0a76c40", features = ["crypto-ed25519", "crypto-k256", "crypto-p256"] }
catbird-atproto = { path = "../../catbird-atproto", features = ["namespace-bluecatbird", "namespace-atproto-space"] }
bytes = { version = "1", features = ["serde"] }
cid = "0.11"
multihash = "0.19.3"
ed25519-dalek = { version = "2", features = ["rand_core"] }
iroh-car = "0.5"
n0-future = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
k256 = { version = "0.13", features = ["ecdsa", "jwk"] }
multibase = "0.9"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
blake3 = "1"
serde_ipld_dagcbor = "0.6"
serde_bytes = "0.11"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1"
anyhow = "1"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
rcgen = "0.13"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
wiremock = "0.6"
