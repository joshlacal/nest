[package]
name = "circle-appview"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json"] }
catbird-atproto = { path = "../../catbird-atproto", features = ["namespace-bluecatbird", "namespace-atproto-space"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
k256 = { version = "0.13", features = ["ecdsa", "jwk"] }
multibase = "0.9"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
blake3 = "1"
serde_ipld_dagcbor = "0.6"
serde_bytes = "0.11"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1"
anyhow = "1"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
rcgen = "0.13"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
