[package]
name = "circle-appview"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "uuid", "json"] }
# Petrel Rust: AT Protocol types, Spaces crypto and runtime lexicon validation.
# Sibling path dependencies; the Docker build copies Petrel/rust and PetrelCatbird.
petrel-core = { path = "../../Petrel/rust/petrel-core", features = ["chrono"] }
petrel-api = { path = "../../Petrel/rust/petrel-api", features = ["app_bsky", "com_atproto"] }
petrel-spaces = { path = "../../Petrel/rust/petrel-spaces" }
petrel-lexicon = { path = "../../Petrel/rust/petrel-lexicon" }
petrel-catbird = { path = "../../PetrelCatbird/rust/petrel-catbird" }
bytes = { version = "1", features = ["serde"] }
cid = "0.11"
ed25519-dalek = { version = "2", features = ["rand_core"] }
n0-future = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `pem` is required to accept SEC1 keys ("BEGIN EC PRIVATE KEY"), which is what
# `openssl ecparam -genkey` produces by default.
p256 = { version = "0.13", features = ["ecdsa", "jwk", "pem", "ecdh"] }
k256 = { version = "0.13", features = ["ecdsa", "jwk"] }
multibase = "0.9"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
blake3 = "1"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio-tungstenite = { version = "0.26.2", features = ["native-tls"] }
futures-util = "0.3"
ciborium = "0.2"
sfv = "=0.16.1"
thiserror = "1"
unicode-segmentation = "1"
zeroize = "1"
anyhow = "1"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
rcgen = "0.13"
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
wiremock = "0.6"
